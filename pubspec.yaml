name: smart_local_cache
description: "Local storage for Flutter with no third-party packages: Map records, live streams, queries, indexes, AES-256 encryption and a disk-backed box for big data."
version: 2.2.1
homepage: https://github.com/sandeepflutter1999/smart_local_storage
repository: https://github.com/sandeepflutter1999/smart_local_storage
issue_tracker: https://github.com/sandeepflutter1999/smart_local_storage/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.smartlocalstorage.smart_local_storage
        pluginClass: SmartLocalStoragePlugin
      ios:
        pluginClass: SmartLocalStoragePlugin
      macos:
        dartPluginClass: SmartLocalStorageDesktop
      linux:
        dartPluginClass: SmartLocalStorageDesktop
      windows:
        dartPluginClass: SmartLocalStorageDesktop
